name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # production bundle, the same build that vscode:prepublish runs when packaging
      - run: npm run vscode:prepublish
      # compiles, lints, then runs the tests in a downloaded VS Code, which needs a display
      - run: xvfb-run -a npm test
